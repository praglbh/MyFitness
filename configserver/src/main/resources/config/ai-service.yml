spring:
  mongodb:
    uri: mongodb://localhost:27017/activityrecommendations

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        default-requeue-rejected: false   # failed messages are not redelivered in a loop
        concurrency: 1
        max-concurrency: 1
        prefetch: 1                       # one message at a time

server:
  port: 8083

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking

gemini:
  api:
    url: ${GEMINI_API_URL}
    key: ${GEMINI_API_KEY}