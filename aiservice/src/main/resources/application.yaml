spring:
  application:
    name: ai-service

data:
    mongodb:
      uri: mongodb://localhost:27017/activityrecommendations
      database: activityrecommendations

server:
  port: 8083
eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: false
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
